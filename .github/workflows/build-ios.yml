name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project NXEditor.xcodeproj \
            -scheme NXEditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/NXEditor.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr NXEditor-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NXEditor-unsigned-ipa
          path: NXEditor-unsigned.ipa

      - name: Write error log
        if: failure()
        run: |
          cp build.log error.txt || echo "Build failed before producing a log." > error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NXEditor-build-error
          path: error.txt
